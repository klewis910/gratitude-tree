
name: Test Gratitude Sync

on:
  workflow_dispatch:

jobs:
  test-download:
    runs-on: ubuntu-latest
    steps:
      - name: Test OneDrive JSON download
        env:
          ONEDRIVE_URL: ${{ secrets.ONEDRIVE_JSON_URL }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request

          url = os.environ["ONEDRIVE_URL"]

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/octet-stream,application/json,*/*",
                  "Referer": "https://k12inc-my.sharepoint.com/"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = response.read()
              content_type = response.headers.get("Content-Type", "")

          print("HTTP download succeeded.")
          print("Content type:", content_type)
          print("Downloaded bytes:", len(data))

          try:
              records = json.loads(data)
              if not isinstance(records, list):
                  raise ValueError("JSON is not an array")
              print("SUCCESS: Valid JSON array downloaded.")
              print("Number of records:", len(records))
          except (ValueError, UnicodeDecodeError):
              print("FAILED: Downloaded content is not the expected JSON array.")
              raise SystemExit(1)
          PY
